name: Release

# Builds self-contained Linux binaries and, for a v* tag, publishes them as a GitHub release:
#   protondrive-<version>-linux-x64.tar.gz, protondrive-<version>-linux-arm64.tar.gz, SHA256SUMS
# Each archive holds the program, the systemd user units, README, LICENSE and install.sh.
#
# The Proton.* packages come from this owner's GitHub Packages feed. GITHUB_TOKEN can read them only if each
# package (Proton.Sdk, Proton.Drive.Sdk, Proton.Drive.Sdk.Account, Proton.Cryptography) grants this repository
# access: package settings > Manage Actions access > add this repository with the Read role.
#
# After the release is published, the "aur" job updates the AUR package nsky-protondrive-client-bin
# (packaging/aur/update-aur.sh). It needs the repository secret AUR_SSH_PRIVATE_KEY: the private half of an SSH key
# whose public half is added to the AUR account that maintains the package. Optional repository variables
# AUR_GIT_NAME and AUR_GIT_EMAIL set the author of the AUR commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) as the oldest supported base; the binaries need glibc 2.34 or newer.
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOTNET_NOLOGO: true
      NUGET_GITHUB_USER: ${{ github.repository_owner }}
      NUGET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build archive
        run: make dist RID=${{ matrix.rid }}

      - name: Smoke-test the installer
        run: |
          dir=$(ls -d artifacts/protondrive-*-${{ matrix.rid }})
          sudo sh "$dir/install.sh"
          protondrive version
          test -f /usr/local/lib/systemd/user/protondrive-sync-watch.service
          sudo sh "$dir/install.sh" --uninstall
          test ! -e /usr/local/bin/protondrive

      - uses: actions/upload-artifact@v4
        with:
          name: protondrive-${{ matrix.rid }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "protondrive ${GITHUB_REF_NAME#v}" \
            --notes "Beta release, provided as is, without warranty. Unofficial; not affiliated with Proton AG. See the README's Install section and Disclaimer."

  aur:
    name: Update the AUR package
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # makepkg and updpkgsums need Arch Linux.
    container: archlinux:base-devel
    steps:
      - name: Check the AUR key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::The repository secret AUR_SSH_PRIVATE_KEY is not set; the AUR package was not updated."
            exit 1
          fi

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/aur

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up a build user and SSH access to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # makepkg refuses to run as root.
          useradd --create-home builder
          ssh_dir=/home/builder/.ssh
          install -d -m 700 -o builder -g builder "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          # The AUR's host key, pinned. Its fingerprint, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4,
          # is published on https://aur.archlinux.org.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh_dir/known_hosts"
          printf '%s\n' \
            'Host aur.archlinux.org' \
            '  User aur' \
            '  IdentityFile ~/.ssh/aur' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' > "$ssh_dir/config"
          chown -R builder:builder "$ssh_dir"
          chmod 600 "$ssh_dir"/*
          chmod -R a+rX dist packaging

      - name: Update and push the AUR package
        env:
          GIT_AUTHOR_NAME: ${{ vars.AUR_GIT_NAME || github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ vars.AUR_GIT_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}
          GIT_COMMITTER_NAME: ${{ vars.AUR_GIT_NAME || github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ vars.AUR_GIT_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}
        run: |
          runuser --preserve-environment -u builder -- env HOME=/home/builder \
            sh packaging/aur/update-aur.sh "${GITHUB_REF_NAME#v}" dist --push

